name: ufotable Daily Healthcheck

on:
  push:
    paths:
      - 'ufotable_healthcheck.py'
      - 'ufotable_monitor.py'
      - 'common.py'
      - 'ufotable_config.example.json'
      - '.github/workflows/ufotable-healthcheck.yml'
  schedule:
    - cron: '17 18 * * *'  # 北京时间 2:17
    - cron: '17 20 * * *'  # 北京时间 4:17
    - cron: '17 22 * * *'  # 北京时间 6:17
  workflow_dispatch:

concurrency:
  group: ufotable-healthcheck
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp ufotable_config.example.json ufotable_config.json

      - name: Restore DB cache
        uses: actions/cache/restore@v4
        id: cache-db
        with:
          path: |
            data/ufotable.db
            data/ufotable_state_snapshot.json
          key: ufotable-db-v2-${{ github.run_id }}
          restore-keys: |
            ufotable-db-v2-
            ufotable-db-v1-

      - name: Run Healthcheck
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python ufotable_healthcheck.py

      - name: Auto-Rebuild DB if needed
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python -c "
          import sqlite3, sys
          from pathlib import Path
          if Path('data/ufotable.db').exists():
              try:
                  conn = sqlite3.connect('data/ufotable.db')
                  result = conn.execute('PRAGMA integrity_check').fetchone()
                  conn.close()
                  if result[0] == 'ok':
                      print('DB OK')
                      sys.exit(0)
                  else:
                      print(f'DB corrupt: {result[0]}')
              except Exception as e:
                  print(f'DB error: {e}')
          else:
              print('DB not found')
          sys.exit(1)
          " || (
            echo "DB broken, rebuilding with snapshot recovery..."
            # 1. 从旧DB尝试导出快照(兜底)
            python -c "
            import json, sqlite3
            from pathlib import Path
            db = Path('data/ufotable.db')
            if db.exists():
                try:
                    conn = sqlite3.connect(str(db))
                    rows = conn.execute('SELECT id, title, available, price, image_url, url, works FROM products').fetchall()
                    snap = {}
                    for r in rows:
                        snap[str(r[0])] = {'title':r[1], 'available':r[2], 'price':r[3], 'image_url':r[4], 'url':r[5], 'vendor':r[6], 'handle':''}
                    conn.close()
                    with open('data/ufotable_state_snapshot_preheal.json', 'w', encoding='utf-8') as f:
                        json.dump(snap, f, ensure_ascii=False)
                    print(f'Pre-heal snapshot: {len(snap)} products')
                except Exception as e:
                    print(f'Snapshot failed: {e}')
            "
            # 2. 删库重建
            rm -f data/ufotable.db data/ufotable.db-wal data/ufotable.db-shm
            # 3. 确定用哪个快照
            if [ -f data/ufotable_state_snapshot_preheal.json ]; then SNAP=data/ufotable_state_snapshot_preheal.json
            elif [ -f data/ufotable_state_snapshot.json ]; then SNAP=data/ufotable_state_snapshot.json
            else SNAP=""; fi
            # 4. 重建基线(含快照恢复)
            if [ -n "$SNAP" ]; then
              python ufotable_monitor.py --once --recover-from="$SNAP"
            else
              python ufotable_monitor.py --once --silent
            fi
          )

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/ufotable.db
            data/ufotable_state_snapshot.json
          key: ufotable-db-v2-${{ github.run_id }}
name: ufotable Daily Healthcheck

on:
  push:
    paths:
      - 'ufotable_healthcheck.py'
      - 'ufotable_monitor.py'
      - 'common.py'
      - 'ufotable_config.example.json'
      - '.github/workflows/ufotable-healthcheck.yml'
  schedule:
    - cron: '17 18 * * *'  # 北京时间 2:17
    - cron: '17 20 * * *'  # 北京时间 4:17
    - cron: '17 22 * * *'  # 北京时间 6:17
  workflow_dispatch:

concurrency:
  group: ufotable-healthcheck
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp ufotable_config.example.json ufotable_config.json

      - name: Pull latest state
        run: git pull --rebase origin main 2>/dev/null || true

      - name: Run Healthcheck
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python -c "
          import json, sys, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import requests

          JST = timezone(timedelta(hours=9))
          issues = []

          print('=== ufotable WEBSHOP Healthcheck ===')

          # 1. Check API
          try:
              r = requests.get('https://client-api.modd.com/UFWE/product',
                               headers={'User-Agent': 'HealthCheck/2.0', 'Origin': 'https://webshop.ufotable.co.jp'},
                               timeout=20)
              if r.status_code == 200:
                  count = len(r.json().get('products', []))
                  print(f'  API OK: {r.status_code} ({count} products)')
              else:
                  issues.append(f'API 返回 {r.status_code}')
                  print(f'  API WARN: {r.status_code}')
          except Exception as e:
              issues.append(f'API 不通: {e}')
              print(f'  API FAIL: {e}')

          # 2. Check JSON state file
          state_file = Path('data/ufotable_state.json')
          if state_file.exists():
              try:
                  state = json.loads(state_file.read_text(encoding='utf-8'))
                  product_count = len(state.get('products', {}))
                  updated_at = state.get('updated_at', 'unknown')
                  print(f'  State OK: {product_count} products, updated {updated_at}')

                  if updated_at:
                      try:
                          update_dt = None
                          ts = updated_at.strip()
                          if 'JST' in ts:
                              update_dt = datetime.strptime(ts.replace(' JST', ''), '%Y-%m-%d %H:%M:%S').replace(tzinfo=JST)
                          else:
                              update_dt = datetime.strptime(ts, '%Y-%m-%d %H:%M:%S')
                          age = (datetime.now(JST) - update_dt.replace(tzinfo=JST) if update_dt.tzinfo is None else datetime.now(JST) - update_dt).total_seconds()
                          age_min = int(age / 60)
                          if age_min > 120:
                              issues.append(f'状态ファイル {age_min} 分未更新')
                              print(f'  DEAD MAN: state is {age_min}min old!')
                          else:
                              print(f'  State age: {age_min}min (OK)')
                      except Exception as e:
                          print(f'  State age check skipped: {e}')
              except Exception as e:
                  issues.append(f'状態ファイル破損: {e}')
                  print(f'  State FAIL: {e}')
          else:
              issues.append('状態ファイル不存在')
              print('  State MISSING')

          # 3. Send report (only on issues)
          cfg = json.load(open('ufotable_config.example.json'))
          nc = cfg.get('notifications', {}).get('feishu', {})
          webhook = os.environ.get('FEISHU_WEBHOOK_URL', nc.get('webhook_url', ''))
          if webhook and 'YOUR_' not in webhook and issues:
              text = ' **ufotable WEBSHOP 自检異常**\n\n' + '\n'.join(f'- {i}' for i in issues)
              text += f'\n\n時間: {datetime.now(JST).strftime(\"%Y-%m-%d %H:%M:%S\")} JST'
              r = requests.post(webhook, json={'msg_type': 'text', 'content': {'text': text}}, timeout=15)
              print(f'  Alert sent: {r.json().get(\"code\")}')
          else:
              print('  All OK, no alert needed')
          "

      - name: Auto-repair if needed
        if: always()
        run: |
          if [ ! -f data/ufotable_state.json ] || ! python -c "import json; json.load(open('data/ufotable_state.json'))" 2>/dev/null; then
            echo "State file missing or corrupt, attempting recovery from git history..."
            mkdir -p data
            # Recover last valid state from git history instead of creating empty state
            LAST_VALID=$(git log --all --format="%H" -- data/ufotable_state.json 2>/dev/null | head -1)
            if [ -n "$LAST_VALID" ]; then
              git show "$LAST_VALID:data/ufotable_state.json" > data/ufotable_state.json 2>/dev/null || true
              if python -c "import json; s=json.load(open('data/ufotable_state.json')); assert len(s.get('products',{}))>0" 2>/dev/null; then
                echo "Recovered valid state ($(python -c "import json; print(len(json.load(open('data/ufotable_state.json')).get('products',{})))") products) from git history"
              else
                echo "Git recovery failed or returned empty state, initializing fresh (first run)"
                echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/ufotable_state.json
              fi
            else
              echo "No git history found, initializing fresh (first run)"
              echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/ufotable_state.json
            fi
            # Do NOT push — let the monitor workflow handle state persistence
            echo "Auto-repair completed (local only, monitor will push)"
          fi

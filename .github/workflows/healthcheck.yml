name: Daily Healthcheck

on:
  push:
    paths:
      - 'healthcheck.py'
      - 'common.py'
      - 'config.example.json'
      - '.github/workflows/healthcheck.yml'
  schedule:
    # 北京时间 2:00 = UTC 18:00
    - cron: '37 18 * * *'
    # 北京时间 4:00 = UTC 20:00 (备用)
    - cron: '37 20 * * *'
    # 北京时间 6:00 = UTC 22:00 (备用)
    - cron: '37 22 * * *'
  workflow_dispatch:

concurrency:
  group: jumpshop-healthcheck
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp config.example.json config.json

      - name: Restore DB cache
        uses: actions/cache/restore@v4
        id: cache-db
        with:
          path: |
            data/products.db
            data/state_snapshot.json
          key: jumpshop-db-v3-${{ github.run_id }}
          restore-keys: |
            jumpshop-db-v3-
            jumpshop-db-v2-

      - name: Run Healthcheck
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python healthcheck.py

      - name: Auto-Rebuild DB (if needed)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          # 如果数据库坏了，尝试用快照恢复
          python -c "
          import sqlite3, sys
          from pathlib import Path
          if Path('data/products.db').exists():
              try:
                  conn = sqlite3.connect('data/products.db')
                  result = conn.execute('PRAGMA integrity_check').fetchone()
                  conn.close()
                  if result[0] == 'ok':
                      print('DB OK')
                      sys.exit(0)
                  else:
                      print(f'DB corrupt: {result[0]}')
              except Exception as e:
                  print(f'DB error: {e}')
          else:
              print('DB not found')
          sys.exit(1)
          " || (
            echo "DB broken, rebuilding with snapshot recovery..."
            # 1. 从旧DB尝试导出快照(兜底)
            python -c "
            import json, sqlite3
            from pathlib import Path
            db = Path('data/products.db')
            if db.exists():
                try:
                    conn = sqlite3.connect(str(db))
                    rows = conn.execute('SELECT id, title, available, price, image_url, url, vendor, handle FROM products').fetchall()
                    snap = {}
                    for r in rows:
                        snap[str(r[0])] = {'title':r[1], 'available':r[2], 'price':r[3], 'image_url':r[4], 'url':r[5], 'vendor':r[6], 'handle':r[7]}
                    conn.close()
                    with open('data/state_snapshot_preheal.json', 'w', encoding='utf-8') as f:
                        json.dump(snap, f, ensure_ascii=False)
                    print(f'Pre-heal snapshot: {len(snap)} products')
                except Exception as e:
                    print(f'Snapshot failed: {e}')
            "
            # 2. 删库重建
            rm -f data/products.db data/products.db-wal data/products.db-shm
            # 3. 确定用哪个快照
            if [ -f data/state_snapshot_preheal.json ]; then SNAP=data/state_snapshot_preheal.json
            elif [ -f data/state_snapshot.json ]; then SNAP=data/state_snapshot.json
            else SNAP=""; fi
            # 4. 重建基线(含快照恢复)
            if [ -n "$SNAP" ]; then
              python healthcheck.py --rebuild --recover-from="$SNAP"
            else
              python healthcheck.py --rebuild
            fi
          )

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/products.db
            data/state_snapshot.json
          key: jumpshop-db-v3-${{ github.run_id }}

name: Jump Shop Monitor

on:
  push:
    paths:
      - 'monitor_loop.py'
      - 'common.py'
      - 'config.example.json'
      - '.github/workflows/monitor.yml'
  schedule:
    # 每6小时触发新job (自循环最长跑350分钟)
    - cron: '7 */6 * * *'
  workflow_dispatch:

concurrency:
  group: jumpshop-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp config.example.json config.json

      - name: Monitor self-loop (JSON state, git-persisted)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set +e
          MAX_RUNTIME_MIN=350
          START_TIME=$(date +%s)
          ITERATION=0

          # Setup state file directory
          mkdir -p data

          # Pull latest state from remote
          git pull --rebase origin main 2>/dev/null || true

          # Init state file if not exists (e.g. first run ever)
          if [ ! -f data/jumpshop_state.json ]; then
            echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/jumpshop_state.json
            echo "State file initialized (first run)"
          fi

          git config user.email "bot@jumpshop.monitor"
          git config user.name "Jump Shop Monitor Bot"

          while true; do
            ITERATION=$((ITERATION + 1))
            ITER_START=$(date +%s)
            ELAPSED=$(( (ITER_START - START_TIME) / 60 ))

            echo "=== [$(date '+%Y-%m-%d %H:%M:%S')] Iteration $ITERATION (elapsed: ${ELAPSED}min / ${MAX_RUNTIME_MIN}min) ==="

            # Run monitor with JSON state (DB optional, for change_log only)
            python monitor_loop.py --once \
              --state-file=data/jumpshop_state.json \
              --db=data/products.db || echo "Monitor iteration failed"

            # Mid-loop state push: every 60 iterations (~1 hour)
            if [ $((ITERATION % 60)) -eq 0 ]; then
              echo "Mid-loop state save to git..."
              git add data/jumpshop_state.json
              if git diff --staged --quiet; then
                echo "  (no state changes)"
              else
                git commit -m "bot(jumpshop): state checkpoint #$ITERATION [skip ci]" || true
                (git pull --rebase origin main && git push origin main) 2>/dev/null || echo "  Push failed (non-fatal)"
              fi
            fi

            # Check time limit
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge $MAX_RUNTIME_MIN ]; then
              echo "Time limit reached (${ELAPSED}min >= ${MAX_RUNTIME_MIN}min)"
              break
            fi

            # Sleep to maintain ~60s interval
            ITER_TOOK=$(( NOW - ITER_START ))
            SLEEP_TIME=$(( 60 - ITER_TOOK ))
            [ $SLEEP_TIME -lt 5 ] && SLEEP_TIME=5
            echo "Iteration took ${ITER_TOOK}s, sleeping ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "Self-loop ended after $ITERATION iterations"

      - name: Save final state to git
        if: always()
        run: |
          git config user.email "bot@jumpshop.monitor"
          git config user.name "Jump Shop Monitor Bot"
          git add data/jumpshop_state.json
          if git diff --staged --quiet; then
            echo "No state changes to save"
          else
            git commit -m "bot(jumpshop): final state [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push retry $i/3..."
              sleep 5
            done || echo "State push failed after 3 retries"
          fi

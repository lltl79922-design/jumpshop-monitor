name: Jump Shop Monitor

on:
  push:
    paths:
      - '.github/workflows/monitor.yml'
  # schedule disabled — project terminated 2026-06-21
  workflow_dispatch:

permissions:
  contents: write  # needed for git push state files

concurrency:
  group: jumpshop-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # v2: JSON state, git-persisted, push every iter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp config.example.json config.json

      - name: Monitor self-loop
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set +e
          MAX_RUNTIME_MIN=350
          START_TIME=$(date +%s)
          ITERATION=0

          mkdir -p data

          # Pull latest state from git (v3: fetch+reset, no rebase)
          git fetch origin main 2>/dev/null && git reset --hard origin/main 2>/dev/null || true

          # Init state file if first run ever
          if [ ! -f data/jumpshop_state.json ]; then
            echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/jumpshop_state.json
            echo "State file initialized (first run)"
          fi

          git config user.email "bot@jumpshop.monitor"
          git config user.name "Jump Shop Monitor Bot"

          # Helper: push state to git (v3: fetch+reset instead of rebase — prevents state corruption)
          # Strategy: backup state → sync with remote → re-apply state → commit → push
          # This avoids git rebase entirely, which was the #1 cause of state file corruption
          push_state() {
            local label="$1"
            local STATE_FILE="data/jumpshop_state.json"
            local BACKUP="/tmp/jumpshop_state_backup.json"

            # Always backup state first — this is the single source of truth
            cp "$STATE_FILE" "$BACKUP"

            for attempt in 1 2 3; do
              # Sync with remote (discard any stale local commits)
              git fetch origin main 2>/dev/null
              git reset --hard origin/main 2>/dev/null

              # Re-apply our state file (always newer than remote)
              cp "$BACKUP" "$STATE_FILE"
              git add "$STATE_FILE"

              if git diff --staged --quiet; then
                echo "  [push_state:$label] no changes vs remote"
                rm -f "$BACKUP"
                return 0
              fi

              git commit -m "bot(jumpshop): state $label [skip ci]" 2>/dev/null || true

              if git push origin main 2>&1; then
                echo "  [push_state:$label] OK (attempt $attempt)"
                rm -f "$BACKUP"
                return 0
              fi

              echo "  [push_state:$label] attempt $attempt/3 failed, retrying..."
              sleep 3
            done

            echo "  [push_state:$label] FAILED after 3 attempts (non-fatal)"
            # Restore state file so next Python iteration has correct baseline
            cp "$BACKUP" "$STATE_FILE"
            rm -f "$BACKUP"
            return 1
          }

          while true; do
            ITERATION=$((ITERATION + 1))
            ITER_START=$(date +%s)
            ELAPSED=$(( (ITER_START - START_TIME) / 60 ))

            echo "=== [$(date '+%Y-%m-%d %H:%M:%S')] Iteration $ITERATION (elapsed: ${ELAPSED}min / ${MAX_RUNTIME_MIN}min) ==="

            # Run monitor
            python monitor_loop.py --once \
              --state-file=data/jumpshop_state.json \
              --db=data/products.db || echo "Monitor iteration failed"

            # Push state aggressively early on (iterations 1-3), then every 10
            if [ $ITERATION -le 3 ] || [ $((ITERATION % 10)) -eq 0 ]; then
              push_state "iter$ITERATION"
            fi

            # Check time limit
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge $MAX_RUNTIME_MIN ]; then
              echo "Time limit reached (${ELAPSED}min >= ${MAX_RUNTIME_MIN}min)"
              break
            fi

            # Sleep to maintain ~60s interval (min 5s)
            ITER_TOOK=$(( NOW - ITER_START ))
            SLEEP_TIME=$(( 60 - ITER_TOOK ))
            [ $SLEEP_TIME -lt 5 ] && SLEEP_TIME=5
            echo "Iteration took ${ITER_TOOK}s, sleeping ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "Self-loop ended after $ITERATION iterations"
          push_state "final"

name: ufotable WEBSHOP Monitor

on:
  push:
    paths:
      - '.github/workflows/ufotable-monitor.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ufotable-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp ufotable_config.example.json ufotable_config.json

      - name: Monitor self-loop
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set +e
          MAX_RUNTIME_MIN=350
          START_TIME=$(date +%s)
          ITERATION=0

          mkdir -p data

          git pull --rebase origin main 2>/dev/null || true

          if [ ! -f data/ufotable_state.json ]; then
            echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/ufotable_state.json
            echo "State file initialized (first run)"
          fi

          git config user.email "bot@jumpshop.monitor"
          git config user.name "ufotable Monitor Bot"

          push_state() {
            local label="$1"
            git add data/ufotable_state.json
            if git diff --staged --quiet; then
              echo "  [push_state:$label] no changes"
              return 0
            fi
            git commit -m "bot(ufotable): state $label [skip ci]" || return 1
            for i in 1 2 3; do
              if git pull --rebase origin main 2>/dev/null && git push origin main 2>/dev/null; then
                echo "  [push_state:$label] OK"
                return 0
              fi
              echo "  [push_state:$label] retry $i/3..."
              sleep 3
            done
            echo "  [push_state:$label] FAILED (non-fatal)"
            return 1
          }

          while true; do
            ITERATION=$((ITERATION + 1))
            ITER_START=$(date +%s)
            ELAPSED=$(( (ITER_START - START_TIME) / 60 ))

            echo "=== [$(date '+%Y-%m-%d %H:%M:%S')] Iteration $ITERATION (elapsed: ${ELAPSED}min / ${MAX_RUNTIME_MIN}min) ==="

            python ufotable_monitor.py --once \
              --state-file=data/ufotable_state.json \
              --db=data/ufotable.db || echo "Monitor iteration failed"

            # Push state aggressively early on, then every 10 iterations
            if [ $ITERATION -le 3 ] || [ $((ITERATION % 10)) -eq 0 ]; then
              push_state "iter$ITERATION"
            fi

            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge $MAX_RUNTIME_MIN ]; then
              echo "Time limit reached (${ELAPSED}min >= ${MAX_RUNTIME_MIN}min)"
              break
            fi

            ITER_TOOK=$(( NOW - ITER_START ))
            SLEEP_TIME=$(( 60 - ITER_TOOK ))
            [ $SLEEP_TIME -lt 5 ] && SLEEP_TIME=5
            echo "Iteration took ${ITER_TOOK}s, sleeping ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "Self-loop ended after $ITERATION iterations"
          push_state "final"

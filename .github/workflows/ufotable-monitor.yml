name: ufotable WEBSHOP Monitor

on:
  push:
    paths:
      - 'ufotable_monitor.py'
      - 'common.py'
      - 'ufotable_config.example.json'
      - '.github/workflows/ufotable-monitor.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ufotable-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Setup config
        run: cp ufotable_config.example.json ufotable_config.json

      - name: Monitor self-loop (JSON state, git-persisted)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set +e
          MAX_RUNTIME_MIN=350
          START_TIME=$(date +%s)
          ITERATION=0

          mkdir -p data

          # Pull latest state
          git pull --rebase origin main 2>/dev/null || true

          # Init state file if needed
          if [ ! -f data/ufotable_state.json ]; then
            echo '{"version":2,"products":{},"soldout_ids":[],"updated_at":"","total_products":0}' > data/ufotable_state.json
            echo "State file initialized (first run)"
          fi

          git config user.email "bot@jumpshop.monitor"
          git config user.name "ufotable Monitor Bot"

          while true; do
            ITERATION=$((ITERATION + 1))
            ITER_START=$(date +%s)
            ELAPSED=$(( (ITER_START - START_TIME) / 60 ))

            echo "=== [$(date '+%Y-%m-%d %H:%M:%S')] Iteration $ITERATION (elapsed: ${ELAPSED}min / ${MAX_RUNTIME_MIN}min) ==="

            # Run monitor with JSON state
            python ufotable_monitor.py --once \
              --state-file=data/ufotable_state.json \
              --db=data/ufotable.db || echo "Monitor iteration failed"

            # Mid-loop state push: every 60 iterations (~1 hour)
            if [ $((ITERATION % 60)) -eq 0 ]; then
              echo "Mid-loop state save to git..."
              git add data/ufotable_state.json
              if git diff --staged --quiet; then
                echo "  (no state changes)"
              else
                git commit -m "bot(ufotable): state checkpoint #$ITERATION [skip ci]" || true
                (git pull --rebase origin main && git push origin main) 2>/dev/null || echo "  Push failed (non-fatal)"
              fi
            fi

            # Check time limit
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START_TIME) / 60 ))
            if [ $ELAPSED -ge $MAX_RUNTIME_MIN ]; then
              echo "Time limit reached (${ELAPSED}min >= ${MAX_RUNTIME_MIN}min)"
              break
            fi

            ITER_TOOK=$(( NOW - ITER_START ))
            SLEEP_TIME=$(( 60 - ITER_TOOK ))
            [ $SLEEP_TIME -lt 5 ] && SLEEP_TIME=5
            echo "Iteration took ${ITER_TOOK}s, sleeping ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "Self-loop ended after $ITERATION iterations"

      - name: Save final state to git
        if: always()
        run: |
          git config user.email "bot@jumpshop.monitor"
          git config user.name "ufotable Monitor Bot"
          git add data/ufotable_state.json
          if git diff --staged --quiet; then
            echo "No state changes to save"
          else
            git commit -m "bot(ufotable): final state [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push retry $i/3..."
              sleep 5
            done || echo "State push failed after 3 retries"
          fi
